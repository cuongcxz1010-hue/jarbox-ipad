name: Build iPad IPA
run-name: Build iPad IPA v${{ inputs.version || 'auto' }}

# Builds an UNSIGNED .ipa on a macOS runner. Install it on the iPad with
# Sideloadly (Windows), which signs it with your own Apple ID.
#
# Started on demand: by tools/JarBoxBuilder.ps1 (the "JarBox Builder" app),
# or from the GitHub website: Actions -> Build iPad IPA -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản (vd: 0.1.1). Để trống = dùng số trong project.'
        required: false
        default: ''

permissions:
  contents: read

# A second build request waits for the running one instead of cancelling it
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$INPUT_VERSION"
          if [ -z "$V" ]; then
            V=$(grep -m1 'MARKETING_VERSION = ' J2MEEmulator.xcodeproj/project.pbxproj | sed -E 's/.*= *"?([^";]+)"?;.*/\1/')
          fi
          if ! echo "$V" | grep -qE '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::Invalid version '$V' (expected e.g. 0.1.1)"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Version $V, build number $GITHUB_RUN_NUMBER"

      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|release_candidate' | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build J2ME API jar
        run: |
          set -e
          bash j2me_api/build.sh
          test -s J2MEEmulator/Resources/jars/j2me_api.jar
          test -s J2MEEmulator/Resources/jars/minijvm_rt.jar

      - name: Build app (unsigned)
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          if ! xcodebuild \
              -project J2MEEmulator.xcodeproj \
              -scheme J2MEEmulator \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              MARKETING_VERSION="$VERSION" \
              CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build > "$LOG" 2>&1; then
            echo "::group::Compiler errors"
            grep -n -E "error:|fatal error" "$LOG" | head -100 || true
            echo "::endgroup::"
            tail -80 "$LOG"
            exit 1
          fi
          tail -5 "$LOG"

      - name: Bundle runtime jars and package IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/JarBox.app"
          if [ ! -d "$APP" ]; then
            echo "JarBox.app not found. App bundles produced:"
            find "$RUNNER_TEMP/DerivedData" -name '*.app' -type d -print
            exit 1
          fi

          # The Xcode project excludes these from Copy Bundle Resources;
          # jvm_bridge.c loads them from the bundle root.
          cp J2MEEmulator/Resources/jars/minijvm_rt.jar "$APP/minijvm_rt.jar"
          cp J2MEEmulator/Resources/jars/j2me_api.jar   "$APP/j2me_api.jar"

          echo "--- Bundle check"
          ls -lh "$APP/minijvm_rt.jar" "$APP/j2me_api.jar"
          find "$APP" -name '*.sf2' -exec ls -lh {} \;
          PL="$APP/Info.plist"
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PL") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PL"))"
          echo "MinimumOSVersion: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PL")"
          echo "UIDeviceFamily:"; /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$PL"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$PL" | grep -q '^ *2$' \
            || { echo "ERROR: app is not built for iPad"; exit 1; }

          IPA="JarBox-iPad-v$VERSION.ipa"
          STAGE="$RUNNER_TEMP/ipa"
          mkdir -p "$STAGE/Payload"
          ditto "$APP" "$STAGE/Payload/JarBox.app"
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/$IPA" Payload)
          ls -lh "$IPA"
          echo "IPA_NAME=$IPA" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: JarBox-iPad-v${{ env.VERSION }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
