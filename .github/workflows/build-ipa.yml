name: Build iPad IPA

# Builds an UNSIGNED .ipa on a macOS runner. Install it on the iPad with
# Sideloadly (Windows), which signs it with your own Apple ID.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|release_candidate' | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build J2ME API jar
        run: |
          set -e
          bash j2me_api/build.sh
          test -s J2MEEmulator/Resources/jars/j2me_api.jar
          test -s J2MEEmulator/Resources/jars/minijvm_rt.jar

      - name: Build app (unsigned)
        run: |
          LOG="$RUNNER_TEMP/xcodebuild.log"
          if ! xcodebuild \
              -project J2MEEmulator.xcodeproj \
              -scheme J2MEEmulator \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build > "$LOG" 2>&1; then
            echo "::group::Compiler errors"
            grep -n -E "error:|fatal error" "$LOG" | head -100 || true
            echo "::endgroup::"
            tail -80 "$LOG"
            exit 1
          fi
          tail -5 "$LOG"

      - name: Bundle runtime jars and package IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/JarBox.app"
          if [ ! -d "$APP" ]; then
            echo "JarBox.app not found. App bundles produced:"
            find "$RUNNER_TEMP/DerivedData" -name '*.app' -type d -print
            exit 1
          fi

          # The Xcode project excludes these from Copy Bundle Resources;
          # jvm_bridge.c loads them from the bundle root.
          cp J2MEEmulator/Resources/jars/minijvm_rt.jar "$APP/minijvm_rt.jar"
          cp J2MEEmulator/Resources/jars/j2me_api.jar   "$APP/j2me_api.jar"

          echo "--- Bundle check"
          ls -lh "$APP/minijvm_rt.jar" "$APP/j2me_api.jar"
          find "$APP" -name '*.sf2' -exec ls -lh {} \;
          PL="$APP/Info.plist"
          echo "MinimumOSVersion: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PL")"
          echo "UIDeviceFamily:"; /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$PL"
          /usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$PL" | grep -q '^ *2$' \
            || { echo "ERROR: app is not built for iPad"; exit 1; }

          STAGE="$RUNNER_TEMP/ipa"
          mkdir -p "$STAGE/Payload"
          ditto "$APP" "$STAGE/Payload/JarBox.app"
          (cd "$STAGE" && zip -qry "$GITHUB_WORKSPACE/JarBox-iPad-unsigned.ipa" Payload)
          ls -lh JarBox-iPad-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JarBox-iPad-ipa
          path: JarBox-iPad-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
